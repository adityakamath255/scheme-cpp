name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch libtommath
        run: git submodule update --init --depth 1 third_party/libtommath
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build site
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v5
